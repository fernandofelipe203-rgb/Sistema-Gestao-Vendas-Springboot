
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kits - Projeto Família</title>

  <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background-color: #f5f6fa;
        color: #2f3542;
        padding: 35px;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    /* CABEÇALHO */

    .cabecalho {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .titulo h1 {
        font-size: 30px;
        margin-bottom: 6px;
    }

    .titulo p {
        color: #747d8c;
        font-size: 14px;
    }

    #btnNovoKit {
        background-color: #2f80ed;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    #btnNovoKit:hover {
        background-color: #246fc5;
    }

    /* FORMULÁRIO */

    #formularioKit {
        background-color: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    #tituloFormulario {
        font-size: 20px;
        margin-bottom: 20px;
    }

    .campos {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #dfe4ea;
        border-radius: 7px;
        font-size: 14px;
        outline: none;
    }

    input:focus {
        border-color: #2f80ed;
    }

    #btnSalvar {
        background-color: #27ae60;
        color: white;
        border: none;
        border-radius: 7px;
        padding: 10px 18px;
        font-weight: bold;
        cursor: pointer;
    }

    #btnSalvar:hover {
        background-color: #219653;
    }

    #btnCancelar {
        background-color: #dfe4ea;
        color: #2f3542;
        border: none;
        border-radius: 7px;
        padding: 10px 18px;
        margin-left: 7px;
        cursor: pointer;
    }

    /* TABELA */

    .card {
        background-color: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .titulo-tabela {
        margin-bottom: 20px;
    }

    .titulo-tabela h2 {
        font-size: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background-color: #f1f3f6;
    }

    th {
        text-align: left;
        padding: 14px;
        color: #747d8c;
        font-size: 13px;
    }

    td {
        padding: 15px 14px;
        border-bottom: 1px solid #edf0f2;
        font-size: 14px;
    }

    tbody tr:hover {
        background-color: #fafafa;
    }

    /* BOTÕES */

    td button {
        border: none;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 13px;
        cursor: pointer;
        margin-right: 5px;
    }

    td button:first-child {
        background-color: #e8f1ff;
        color: #2f80ed;
    }

    td button:last-child {
        background-color: #ffe8e8;
        color: #e74c3c;
    }

    @media (max-width: 700px) {

        body {
            padding: 20px;
        }

        .cabecalho {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .campos {
            grid-template-columns: 1fr;
        }

        .card {
            overflow-x: auto;
        }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- CABEÇALHO -->

  <div class="cabecalho">

    <div class="titulo">

      <h1>Kits</h1>

      <p>
        Gerencie os kits cadastrados no sistema
      </p>

    </div>

    <button id="btnNovoKit">
      + Novo Kit
    </button>

  </div>


  <!-- FORMULÁRIO -->

  <div id="formularioKit" style="display: none;">

    <h2 id="tituloFormulario">
      Cadastrar Kit
    </h2>

    <input type="hidden" id="idKit">

    <div class="campos">

      <input
              type="text"
              id="nome"
              placeholder="Nome do kit">

      <input
              type="number"
              id="valor"
              placeholder="Valor"
              step="0.01">

    </div>

    <button id="btnSalvar">
      Salvar
    </button>

    <button id="btnCancelar">
      Cancelar
    </button>

  </div>


  <!-- LISTA -->

  <div class="card">

    <div class="titulo-tabela">

      <h2>
        Lista de Kits
      </h2>

    </div>

    <table>

      <thead>

      <tr>

        <th>ID</th>
        <th>Nome</th>
        <th>Valor</th>
        <th>Ações</th>

      </tr>

      </thead>

      <tbody id="tabelaKits">

      </tbody>

    </table>

  </div>

</div>


<script src="js/kits.js"></script>

</body>

</html>
