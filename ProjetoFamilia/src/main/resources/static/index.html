
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projeto Família</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topo">
  <h1>Projeto Família</h1>
</header>

<main>

  <section class="boas-vindas">
    <h2>Olá! 👋</h2>
    <p>Bem-vindo ao Projeto Família</p>
  </section>

  <section class="resumo">

    <div class="card-resumo">
      <span>👥</span>

      <div>
        <h3>Clientes</h3>
        <strong id="totalClientes">0</strong>
      </div>
    </div>

    <div class="card-resumo">
      <span>📦</span>

      <div>
        <h3>Produtos</h3>
        <strong id="totalProdutos">0</strong>
      </div>
    </div>

    <div class="card-resumo">
      <span>🎁</span>

      <div>
        <h3>Kits</h3>
        <strong>0</strong>
      </div>
    </div>

  </section>

  <section class="atalhos">

    <h2>Acesso rápido</h2>

    <div class="botoes-atalho">

      <button onclick="window.location.href='clientes.html'">
        👥 Clientes
      </button>

      <button onclick="window.location.href='produtos.html'">
        📦 Produtos
      </button>

      <button>
        🎁 Kits
      </button>

      <button>
        💰 Vendas
      </button>

    </div>

  </section>

</main>
<script src="js/dashboard.js"></script>
</body>

</html>
