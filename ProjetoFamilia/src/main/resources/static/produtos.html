
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produtos - ProjetoFamilia</title>

  <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background-color: #f5f6fa;
        color: #2f3542;
        padding: 35px;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    /* CABEÇALHO */

    .cabecalho {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .titulo h1 {
        font-size: 30px;
        margin-bottom: 6px;
    }

    .titulo p {
        color: #747d8c;
        font-size: 14px;
    }

    #btnNovoProduto {
        background-color: #2f80ed;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    #btnNovoProduto:hover {
        background-color: #246fc5;
    }

    /* FORMULÁRIO */

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.45);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-conteudo {
    background-color: white;
    width: 90%;
    max-width: 700px;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
}

    #tituloFormulario {
        font-size: 20px;
        margin-bottom: 20px;
    }

#precoVendaPreview {
    margin-bottom: 20px;
    padding: 15px;
    background-color: #f1f8f4;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.8;
}

#precoVendaPreview strong {
    font-weight: bold;
}

.preco-venda-final {
    margin-top: 5px;
    padding-top: 8px;
    border-top: 1px solid #d5e8dc;
    font-size: 16px;
}

.preco-venda-final strong {
    font-size: 20px;
}

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #dfe4ea;
        border-radius: 7px;
        font-size: 14px;
        outline: none;
    }

    input:focus {
        border-color: #2f80ed;
    }

    #btnSalvar {
        background-color: #27ae60;
        color: white;
        border: none;
        border-radius: 7px;
        padding: 10px 18px;
        font-weight: bold;
        cursor: pointer;
    }

    #btnSalvar:hover {
        background-color: #219653;
    }

    #btnCancelar {
        background-color: #dfe4ea;
        color: #2f3542;
        border: none;
        border-radius: 7px;
        padding: 10px 18px;
        margin-left: 7px;
        cursor: pointer;
    }

    #btnCancelar:hover {
        background-color: #ced4da;
    }

    /* TABELA */

    .card {
        background-color: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .titulo-tabela {
        margin-bottom: 20px;
    }

    .titulo-tabela h2 {
        font-size: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead {
        background-color: #f1f3f6;
    }

    th {
        text-align: left;
        padding: 14px;
        color: #747d8c;
        font-size: 13px;
        font-weight: bold;
    }

    td {
        padding: 15px 14px;
        border-bottom: 1px solid #edf0f2;
        font-size: 14px;
    }

    tbody tr:hover {
        background-color: #fafafa;
    }

    /* BOTÕES DA TABELA */

    td button {
        border: none;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 13px;
        cursor: pointer;
        margin-right: 5px;
    }

    td button:first-child {
        background-color: #e8f1ff;
        color: #2f80ed;
    }

    td button:first-child:hover {
        background-color: #d7e7ff;
    }

    td button:last-child {
        background-color: #ffe8e8;
        color: #e74c3c;
    }

    td button:last-child:hover {
        background-color: #ffd5d5;
    }
.campos {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
}
    /* RESPONSIVO */

    @media (max-width: 700px) {

        body {
            padding: 20px;
        }

        .cabecalho {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .campos {
            grid-template-columns: 1fr;
        }

        .card {
            overflow-x: auto;
        }
        .titulo-tabela {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
}

#buscarProduto {
    width: 100%;
}

    }
.lucro {
    font-weight: bold;
    color: #27ae60;
}
    .titulo-tabela {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

#buscarProduto {
    width: 300px;
}

  </style>

</head>

<body>

<div class="container">

  <!-- CABEÇALHO -->

  <div class="cabecalho">

    <div class="titulo">

      <h1>Produtos</h1>

      <p>
        Gerencie os produtos cadastrados no sistema
      </p>

    </div>

    <button id="btnNovoProduto">
      + Novo Produto
    </button>

  </div>


  <!-- FORMULÁRIO -->

  <div id="modalProduto" class="modal">

    <div id="formularioProduto" class="modal-conteudo">

      <h2 id="tituloFormulario">
        Cadastrar Produto
      </h2>

    <input type="hidden" id="idProduto">

      <div class="campos">

        <input
                type="text"
                id="nome"
                placeholder="Nome do produto">

        <input
                type="number"
                id="preco"
                placeholder="Preço de custo"
                step="0.01">

        <input
                type="number"
                id="percentualLucro"
                placeholder="Quero ganhar (%)"
                min="0"
                step="1">

        <input
                type="number"
                id="quantidade"
                placeholder="Quantidade">

      </div>

      <div id="precoVendaPreview">

        <div>
          Preço de custo:
          <strong id="previewCusto">R$ 0,00</strong>
        </div>

        <div>
          Quero ganhar:
          <strong id="previewPercentual">0%</strong>
        </div>

        <div class="preco-venda-final">
          Preço de venda:
          <strong id="previewVenda">R$ 0,00</strong>
        </div>

    </div>

    <button id="btnSalvar">
      Salvar
    </button>

    <button id="btnCancelar">
      Cancelar
    </button>
    </div>
  </div>


  <!-- LISTA -->

  <div class="titulo-tabela">
    <h2>Lista de Produtos</h2>

    <input
            type="text"
            id="buscarProduto"
            placeholder="🔍 Buscar produto por nome..."
    >
  </div>

    <table>

      <thead>

      <tr>

        <th>ID</th>
        <th>Nome</th>
        <th>Preço de custo</th>
        <th>Preço de venda</th>
        <th>Lucro (%)</th>
        <th>Lucro (R$)</th>
        <th>Quantidade</th>
        <th>Ações</th>

      </tr>

      </thead>

      <tbody id="tabelaProdutos">

      </tbody>

    </table>

  </div>

</div>


<script src="js/produtos.js"></script>

</body>

</html>
